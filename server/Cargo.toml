[package]
name = "opskills"
version = "0.3.1"
description = "Runbooks your whole team can run: self-hosted job and runbook automation"
license = "Apache-2.0"
repository = "https://github.com/opskills-app/opskills"
homepage = "https://opskills.app"
readme = "../README.md"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.105"
argon2 = "0.6.0"
axum = "0.8.9"
clap = { version = "4.6.10", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
libc = "0.2.191"
redb = "5.0.0"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.2.3"
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1.29.3", features = ["v7"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
