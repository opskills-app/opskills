# OpSkills configuration.
# Every key can be overridden with an environment variable:
# OPSKILLS_<SECTION>__<KEY>, for example OPSKILLS_SERVER__LISTEN=0.0.0.0:9000

[server]
# Address and port to listen on. The preview has no sign-in yet, so it listens
# on this machine only. Use 0.0.0.0:8080 to accept connections from other hosts.
listen = "127.0.0.1:8080"
# Public URL users reach the server at (optional).
# public_url = "https://ops.example.com"

[data]
# Server identity, encryption key and (later) the database live here.
dir = "/var/lib/opskills"

[logs]
# "json" for log collectors, or "pretty" for reading in a terminal.
format = "json"
# Level or filter, for example "info" or "opskills=debug,info".
level = "info"

[auth]
# How long a sign-in lasts, in hours.
session_hours = 8

[runs]
# How many runs may execute at the same time; others wait in the queue.
max_concurrent = 4

[audit]
# Days of audit log to keep (1 to 3650); older events are removed every hour.
retention_days = 90

# SMTP server for email notifications (optional). Email is off until smtp_host is set.
# [email]
# smtp_host = "smtp.example.com"
# smtp_port = 587
# "starttls" (port 587), "tls" (port 465) or "none" (a relay on your own network)
# security = "starttls"
# username = "opskills@example.com"
# password = "app-password"
# from = "OpSkills <opskills@example.com>"
