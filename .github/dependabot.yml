# Weekly dependency updates, grouped to keep the number of pull requests small.
# Security updates are separate and arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /server
    schedule: { interval: weekly, day: monday }
    groups:
      rust-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly, day: monday }
    groups:
      web-app-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      website-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
