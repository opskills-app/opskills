name: Website

# Deploys web/ to Cloudflare Workers (opskills.app, getopskills.com, opskills.dev).
# Runs after each release (called by release.yml), on merges to main that change web/,
# and by hand. It always deploys web/ as it is on main, whatever started it, so a site
# fix merged while a release is still building isn't lost. It deploys only when every
# release the site links to exists, so a version bump merged before its release never
# sends visitors to missing downloads.
#
# Needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable.
# See RELEASING.md.

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/site.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check that the linked releases exist
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(grep -o 'releases/download/v[0-9][0-9.]*/' web/public/index.html | sed 's|releases/download/||; s|/$||' | sort -u)
          missing=""
          for v in $versions; do
            gh release view "$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Not deploying: the site links to${missing}, which isn't released yet. The release workflow deploys the site after publishing it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Linked releases: ${versions:-none}"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Deploy
        if: steps.gate.outputs.deploy == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable. See RELEASING.md."
            exit 1
          fi
          npm ci --no-audit --no-fund
          npx wrangler deploy

      - name: Check the live site
        if: steps.gate.outputs.deploy == 'true'
        run: |
          want=$(sha256sum web/public/index.html | cut -d' ' -f1)
          for i in $(seq 1 12); do
            got=$(curl -fsS -H 'Cache-Control: no-cache' "https://opskills.app/?deploy=$GITHUB_RUN_ID-$i" | sha256sum | cut -d' ' -f1)
            if [ "$got" = "$want" ]; then
              echo "### Deployed to [opskills.app](https://opskills.app/)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://opskills.app/ still doesn't match web/public/index.html after two minutes."
          exit 1
